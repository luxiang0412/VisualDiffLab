name: Package MSIX (manual or tag)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'

      - name: Build unsigned MSIX
        run: dotnet build src/VisualDiffLab.App/VisualDiffLab.App.csproj -c Release -p:Platform=x64 -r win-x64 -p:VisualDiffLabPackaged=true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-lab-msix-unsigned
          path: artifacts/msix/**/*.msix

      # Signing, Store submission and clean-machine install are intentionally not
      # automated here: they require owner-controlled certificate/Partner Center
      # credentials and a disposable clean Windows VM. See docs/reports/release-readiness.md.
